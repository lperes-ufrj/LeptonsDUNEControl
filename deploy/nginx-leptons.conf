# /etc/nginx/sites-available/leptons (e um link em sites-enabled).
# Troque o server_name e os caminhos do certificado.

server {
    listen 80;
    listen [::]:80;
    server_name leptons.exemplo.ufrj.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leptons.exemplo.ufrj.br;

    ssl_certificate     /etc/ssl/certs/leptons.crt;
    ssl_certificate_key /etc/ssl/private/leptons.key;

    # planilhas, anexos e arquivos de controle (o programa aceita até 200 MB)
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # "Export all PDFs" gera um PDF por amostra numa requisição só
        proxy_read_timeout 300s;
    }
}
